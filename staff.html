<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Operations - Medicare Hospital</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f8ff;
        }
        .header {
            background: #0077b6;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 { margin: 0; }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-tag {
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
        }
        .logout-btn {
            background: white;
            color: #0077b6;
            border: 0;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: #e3f2fd;
        }
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }
        .welcome {
            text-align: center;
            margin-bottom: 30px;
        }
        .welcome h1 {
            color: #0077b6;
            margin-top: 0;
            margin-bottom: 8px;
        }
        .welcome p {
            color: #555;
            margin: 0;
        }
        .profile-card,
        .form-box,
        .table-box {
            background: white;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
            border: 1px solid #e1effa;
            margin-bottom: 30px;
        }
        .section-title {
            color: #0077b6;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            border-bottom: 2px solid #f1f8ff;
            padding-bottom: 10px;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .profile-avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #e0f2fe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
        }
        .profile-header h2 {
            margin: 0 0 5px;
            color: #173f50;
        }
        .role-pill {
            background: #e0f2fe;
            color: #0284c7;
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: bold;
        }
        .staff-info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .info-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #0077b6;
        }
        .info-label {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .info-value {
            font-size: 16px;
            color: #1e293b;
            font-weight: bold;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        input, select {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus, select:focus {
            border-color: #0077b6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 119, 182, 0.15);
        }
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .save-btn {
            background: #0077b6;
            color: white;
        }
        .save-btn:hover {
            background: #005f8f;
        }
        .clear-btn {
            background: #e8eef2;
            color: #333;
        }
        .clear-btn:hover {
            background: #d8e2e8;
        }
        .table-box {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th {
            background: #0077b6;
            color: white;
            padding: 12px;
            text-align: left;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }
        .delete-btn {
            background: #ffe9e9;
            color: #d62828;
            border: 1px solid #ffccd5;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s;
        }
        .delete-btn:hover {
            background: #d62828;
            color: white;
        }
        @media(max-width:850px) {
            .staff-info-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media(max-width:600px) {
            .staff-info-grid,
            .form-grid {
                grid-template-columns: 1fr;
            }
            .header {
                padding: 15px;
            }
            .container {
                width: 95%;
            }
        }
    </style>
</head>
<body>
<header class="header">
    <h2>🏥 Medicare Hospital</h2>
    <div class="header-actions">
        <span class="user-tag current-user-badge">Staff Member</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</header>

<main class="container">
    <div class="welcome">
        <h1>Staff Operations Dashboard</h1>
        <p>Personnel Management & Active Staff Directory</p>
    </div>

    <!-- Active Staff Profile Section: Staff ID, Name, Role, Phone No -->
    <div class="profile-card">
        <div class="profile-header">
            <div class="profile-avatar">👨‍💼</div>
            <div>
                <h2 id="staffProfileName">Sunita Rao</h2>
                <span class="role-pill" id="staffProfileRole">Nurse</span>
            </div>
        </div>
        <div class="staff-info-grid">
            <div class="info-item">
                <div class="info-label">Staff ID</div>
                <div class="info-value" id="staffProfileId">S001</div>
            </div>
            <div class="info-item">
                <div class="info-label">Name</div>
                <div class="info-value" id="staffProfileFullName">Sunita Rao</div>
            </div>
            <div class="info-item">
                <div class="info-label">Role</div>
                <div class="info-value" id="staffProfileRoleText">Nurse</div>
            </div>
            <div class="info-item">
                <div class="info-label">Phone Number</div>
                <div class="info-value" id="staffProfilePhone">9876543230</div>
            </div>
        </div>
    </div>

    <!-- Add Staff Form: Staff ID, Name, Role, Phone No -->
    <div class="form-box">
        <h2 class="section-title">Add / Update Staff Member</h2>
        <form id="staffForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Staff ID (Optional)</label>
                    <input type="text" id="staffId" placeholder="Auto-generated if left blank (e.g. S005)">
                </div>
                <div class="form-group">
                    <label>Staff Name *</label>
                    <input type="text" id="staffName" placeholder="Enter staff full name" required>
                </div>
                <div class="form-group">
                    <label>Staff Role *</label>
                    <select id="staffRole" required>
                        <option value="">Select Role</option>
                        <option value="Nurse">Nurse</option>
                        <option value="Receptionist">Receptionist</option>
                        <option value="Lab Technician">Lab Technician</option>
                        <option value="Pharmacist">Pharmacist</option>
                        <option value="Accountant">Accountant</option>
                        <option value="Ward Staff">Ward Staff</option>
                        <option value="Security Supervisor">Security Supervisor</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="tel" id="staffPhone" placeholder="Enter 10-digit phone number" maxlength="10" required>
                </div>
            </div>
            <div class="buttons">
                <button type="submit" class="save-btn">
                    Save Staff Member
                </button>
                <button type="button" class="clear-btn" onclick="clearForm()">
                    Clear Form
                </button>
            </div>
        </form>
    </div>

    <!-- Staff Directory Table: Staff ID, Name, Role, Phone No -->
    <div class="table-box">
        <h2 class="section-title">Staff Records Directory</h2>
        <table>
            <thead>
                <tr>
                    <th>Staff ID</th>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Phone Number</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="staffTable">
                <!-- Dynamically populated via script.js -->
            </tbody>
        </table>
    </div>
</main>

<script src="js/script.js"></script>
</body>
</html>
