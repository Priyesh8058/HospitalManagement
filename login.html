<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicare Hospital - Login</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                linear-gradient(
                    rgba(0, 80, 130, 0.40),
                    rgba(0, 80, 130, 0.40)
                ),
                url("hospital-bg.jpg") center / cover no-repeat fixed;
        }
        .login-box {
            width: 400px;
            max-width: 100%;
            padding: 35px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }
        .hospital-icon {
            text-align: center;
            font-size: 48px;
            margin-bottom: 8px;
        }
        h1 {
            text-align: center;
            color: #0077a3;
            margin: 5px 0;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #555;
            margin: 6px 0 20px;
            font-size: 14px;
        }
        .quick-roles {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .quick-badge {
            background: #e3f2fd;
            color: #0077a3;
            border: 1px solid #bde0fe;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-badge:hover {
            background: #0077a3;
            color: white;
        }
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            background: white;
        }
        input:focus, select:focus {
            border-color: #0083b0;
            outline: 2px solid #d6f2ff;
        }
        .login-btn {
            width: 100%;
            padding: 13px;
            background: #0083b0;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: #006d91;
        }
        .back-home {
            text-align: center;
            margin-top: 20px;
        }
        .back-home a {
            color: #0083b0;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
        .back-home a:hover {
            text-decoration: underline;
        }
        .footer-text {
            border-top: 1px solid #eee;
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            font-size: 12px;
            color: #777;
        }
        @media (max-width: 480px) {
            .login-box {
                padding: 25px;
            }
            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="hospital-icon">🏥</div>
        <h1>Medicare Hospital</h1>
        <div class="subtitle">
            Hospital Management System
        </div>

        <div style="text-align: center; font-size: 12px; color: #666; margin-bottom: 8px;">
            Quick Login Autofill:
        </div>
        <div class="quick-roles">
            <span class="quick-badge" onclick="fillLogin('admin', 'admin123', 'admin')">Admin</span>
            <span class="quick-badge" onclick="fillLogin('dr.sharma', 'doctor123', 'doctor')">Doctor</span>
            <span class="quick-badge" onclick="fillLogin('staff_sunita', 'staff123', 'staff')">Staff</span>
            <span class="quick-badge" onclick="fillLogin('rahul_kumar', 'patient123', 'patient')">Patient</span>
            <span class="quick-badge" onclick="fillLogin('reception', 'appoint123', 'appointment')">Appointments</span>
            <span class="quick-badge" onclick="fillLogin('cashier', 'pay123', 'payment')">Payment</span>
        </div>

        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text"
                   id="username"
                   placeholder="Enter username"
                   value="admin"
                   required>

            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   placeholder="Enter password"
                   value="admin123"
                   required>

            <label for="role">Login As</label>
            <select id="role" required>
                <option value="">Select Role</option>
                <option value="admin" selected>Admin</option>
                <option value="doctor">Doctor</option>
                <option value="staff">Staff</option>
                <option value="patient">Patient</option>
                <option value="appointment">Appointment Management</option>
                <option value="payment">Payment</option>
            </select>

            <button type="submit" class="login-btn">
                Secure Login
            </button>
        </form>

        <div class="back-home">
            <a href="index.html">← Back to Home Page</a>
        </div>
        <div class="footer-text">
            © 2026 Medicare Hospital. All Rights Reserved.
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        function fillLogin(user, pass, role) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            document.getElementById('role').value = role;
        }
    </script>
</body>
</html>
