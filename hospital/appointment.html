<!DOCTYPE html>
<html>
<head>
    <title>Appointment Booking</title>

    <style>
        body {
            font-family: Arial;
            background: #e3f2fd;
        }

        .box {
            width: 400px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px gray;
        }
        h2 { text-align: center;color: #0077b6;
        }
        input, select, textarea, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }
        button {
            background: #0077b6;
            color: white;
            border: none;
            cursor: pointer;
        }
        .logout {
            background: #e63946;
        }
    </style>
</head>
<body>
<div class="box">
    <h2>Book Appointment</h2>
    <form onsubmit="bookAppointment(event)">
        <input type="text" placeholder="Patient Name" required>
        <input type="number" placeholder="Age" required>
        <select required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>
        <input type="int" placeholder="Phone Number" maxlength="10" required>
        <input type="date" required>
        <input type="time" required>
        <textarea placeholder="Symptoms / Problem"></textarea>
        <button type="submit">Book Appointment</button>
    </form>
    <button class="logout" onclick="logout()">Logout</button>
</div>
<script>
function bookAppointment(event) {
    event.preventDefault();
    alert("Appointment Booked Successfully!");
}
function logout() {
    localStorage.removeItem("role");
    window.location.href = "index.html";
}
</script>
</body>
</html>
