<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Management - Medicare Hospital</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f8ff;
        }
        .header {
            background: #0077b6;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 {
            margin: 0;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-tag {
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
        }
        .back-btn {
            background: white;
            color: #0077b6;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            border: 1px solid #cbd5e1;
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: #005f8f;
            color: white;
        }
        .container {
            width: 90%;
            max-width: 1050px;
            margin: 30px auto;
        }
        .title {
            text-align: center;
            color: #0077b6;
            margin-top: 0;
        }
        .payment-box,
        .records-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
            border: 1px solid #e1effa;
            margin-top: 25px;
        }
        .records-box h2 {
            color: #0077b6;
            margin-top: 0;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }
        input,
        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus, select:focus {
            border-color: #0077b6;
            outline: none;
        }
        .amount-box {
            margin-top: 20px;
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px dashed #0077b6;
        }
        .amount-box h2 {
            color: #0077b6;
            margin: 0;
            font-size: 22px;
        }
        .buttons {
            text-align: center;
            margin-top: 25px;
        }
        button {
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            color: white;
            margin: 5px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .pay-btn {
            background: #0077b6;
        }
        .pay-btn:hover {
            background: #005f8f;
        }
        .clear-btn {
            background: #e8eef2;
            color: #333;
        }
        .clear-btn:hover {
            background: #d8e2e8;
        }
        .records-box {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #0077b6;
            color: white;
            padding: 12px;
            text-align: left;
        }
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .delete-btn {
            background: #ffe9e9;
            color: #d62828;
            border: 1px solid #ffccd5;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .delete-btn:hover {
            background: #d62828;
            color: white;
        }
        @media(max-width:700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header class="header">
    <h2>🏥 Medicare Hospital</h2>
    <div class="header-actions">
        <span class="user-tag current-user-badge">Staff</span>
        <a href="admin.html" class="back-btn dynamic-back">
            ← Back to Dashboard
        </a>
    </div>
</header>
<div class="container">
    <h1 class="title">Payment Management</h1>
    <div class="payment-box">
        <form id="paymentForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Payment ID (Optional)</label>
                    <input type="text" id="paymentId"
                           placeholder="Auto-generated if left blank (e.g. PAY005)">
                </div>
                <div class="form-group">
                    <label>Bill ID</label>
                    <input type="text" id="paymentBillId"
                           placeholder="Enter Bill ID (e.g. B001 to auto-fill)" required>
                </div>
                <div class="form-group">
                    <label>Patient ID</label>
                    <input type="text" id="paymentPatientId"
                           placeholder="Enter Patient ID (e.g. P001)" required>
                </div>
                <div class="form-group">
                    <label>Payment Amount (₹)</label>
                    <input type="number" id="paymentAmount"
                           placeholder="Enter Amount"
                           min="0" required>
                </div>
                <div class="form-group">
                    <label>Payment Date</label>
                    <input type="date" id="paymentDate" required>
                </div>
                <div class="form-group">
                    <label>Payment Status</label>
                    <select id="paymentStatus" required>
                        <option value="">Select Status</option>
                        <option value="Paid">Paid</option>
                        <option value="Pending">Pending</option>
                    </select>
                </div>
            </div>
            <div class="amount-box">
                <h2 id="totalAmount">Payment Amount: ₹0</h2>
            </div>
            <div class="buttons">
                <button type="submit" class="pay-btn">
                    Save Payment
                </button>
                <button type="button" class="clear-btn"
                        onclick="clearForm()">
                    Clear Form
                </button>
            </div>
        </form>
    </div>
    <div class="records-box">
        <h2>Hospital Payment Records</h2>
        <table>
            <thead>
                <tr>
                    <th>Payment ID</th>
                    <th>Bill ID</th>
                    <th>Patient ID</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="paymentTable"></tbody>
        </table>
    </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
